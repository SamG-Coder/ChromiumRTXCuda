<style include="settings-shared site-settings-shared"></style>
<settings-subpage page-title="$i18n{siteSettingsNativeGpu}"
    search-label="$i18n{siteSettingsAllSitesFilter}"
    search-icon="settings20:filter-list"
    search-term="{{searchTerm}}" route-path$="[[routePath]]">
  <div class="content-settings-header secondary">
    $i18n{siteSettingsNativeGpuDescription}
  </div>
  <settings-category-default-radio-group
      category="[[contentSettingsTypesEnum_.NATIVE_GPU]]"
      ask-option-label="$i18n{siteSettingsNativeGpuAsk}"
      ask-option-icon="settings:devices"
      block-option-label="$i18n{siteSettingsNativeGpuBlocked}"
      block-option-icon="cr:block">
  </settings-category-default-radio-group>
  <category-setting-exceptions
      category="[[contentSettingsTypesEnum_.NATIVE_GPU]]"
      block-header="$i18n{siteSettingsNativeGpuBlockedExceptions}"
      allow-header="$i18n{siteSettingsNativeGpuAllowedExceptions}"
      search-filter="[[searchTerm]]">
  </category-setting-exceptions>
</settings-subpage>
